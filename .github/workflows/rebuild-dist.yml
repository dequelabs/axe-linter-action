name: Rebuild dist

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Action
    permissions:
      contents: read # Check out the repository
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      dist-stale: ${{ steps.check-dist.outputs.stale }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10.32.1'
      - name: Set Up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Action
        run: pnpm build
      - name: Check Committed dist
        id: check-dist
        run: .github/scripts/check-dist.sh
      - name: Upload Built dist
        if: ${{ steps.check-dist.outputs.stale == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  open-pr:
    needs: build
    if: ${{ needs.build.outputs.dist-stale == 'true' }}
    name: Open Rebuild Pull Request
    permissions:
      contents: read # Check out the repository
    environment:
      name: Rebuild
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove Committed dist
        run: rm -rf dist
      - name: Download Built dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Push Branch and Open Pull Request
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: .github/scripts/rebuild-dist/open-pr.sh
